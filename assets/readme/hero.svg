<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Dawn UI — 从设计方向到实际画面</title>
  <desc id="desc">给 AI Agent 的 UI 设计技能：探索不同方向，在同屏对比中选择，再用实际截图与操作结果验证。</desc>
  <rect width="1200" height="440" rx="12" fill="#f5f3eb"/>
  <g fill="#253b31" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif">
    <text x="64" y="68" font-size="27" letter-spacing="2">UI DESIGN SKILL FOR AGENTS</text>
    <text x="56" y="216" font-size="144" font-weight="650" letter-spacing="-8">Dawn UI</text>
    <text x="64" y="280" font-size="40" font-weight="500">从设计方向，到经得起验证的界面。</text>
  </g>
  <g id="selection" fill="#f5f3eb" stroke="#456c50" stroke-width="2">
    <path d="M683 99H1126V224H683Z" fill="none"/>
    <rect x="679" y="95" width="8" height="8"/><rect x="1122" y="95" width="8" height="8"/>
    <rect x="679" y="220" width="8" height="8"/><rect x="1122" y="220" width="8" height="8"/>
  </g>
  <g id="direction-specimens" transform="translate(713 124)">
    <rect width="108" height="74" fill="#d9e2d3"/>
    <path d="M14 17h48M14 28h32M14 54h78" stroke="#456c50" stroke-width="5"/>
    <rect x="134" width="108" height="74" fill="#253b31"/>
    <circle cx="188" cy="30" r="15" fill="#f0ce86"/><path d="M157 58h61" stroke="#f5f3eb" stroke-width="5"/>
    <rect x="268" width="108" height="74" fill="#d35b3b"/>
    <path d="M281 14h82M281 30h82M281 46h48M281 62h66" stroke="#f5f3eb" stroke-width="5"/>
  </g>
  <path d="M64 319H1136" stroke="#c6ccbf"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="35" font-weight="500" fill="#253b31">
    <text x="64" y="385">探索方向</text><text x="468" y="385">同屏选择</text><text x="872" y="385">实际验证</text>
  </g>
  <g stroke="#6e7d6a" stroke-width="2" fill="none"><path d="M298 374h102m-10-8 10 8-10 8"/><path d="M702 374h102m-10-8 10 8-10 8"/></g>
</svg>
